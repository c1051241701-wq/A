<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="本地错题管理、答题与笔记工具">
    <title>错题本</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232F6F5E'/%3E%3Cpath d='M18 17h28v30H18z' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='m24 33 6 6 12-14' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #faf9f5;
  --text: #1d1d1b;
  --muted: #75736b;
  --muted-2: #9b988f;
  --border: #e5e2da;
  --border-strong: #cfcbc1;
  --accent: #2f6f5e;
  --accent-hover: #285f51;
  --accent-soft: #eaf2ee;
  --accent-border: #c9ddd4;
  --danger: #b24a3f;
  --danger-soft: #fbedeb;
  --danger-border: #e4c2bc;
  --warn: #8a6420;
  --warn-soft: #fbf3e4;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(29, 29, 27, 0.03), 0 18px 48px rgba(29, 29, 27, 0.045);
  --font-ui: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  color-scheme: light;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  top: -220px;
  left: 50%;
  width: 760px;
  height: 460px;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(47, 111, 94, 0.07), transparent 72%);
  pointer-events: none;
  z-index: 0;
}

body.modal-open {
  overflow: hidden;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  color: inherit;
}

button:not(:disabled) {
  cursor: pointer;
}

::selection {
  background: var(--accent-soft);
  color: var(--text);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.icon-sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.icon {
  width: 18px;
  height: 18px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.app {
  position: relative;
  z-index: 1;
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px 28px 36px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 22px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-mark {
  width: 42px;
  height: 42px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: var(--accent);
  color: #fff;
  box-shadow: 0 6px 18px rgba(47, 111, 94, 0.18);
}

.brand-mark .icon {
  width: 23px;
  height: 23px;
  stroke-width: 1.7;
}

.brand h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 650;
  letter-spacing: -0.02em;
}

.brand p {
  margin: 2px 0 0;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 40px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease,
    transform 160ms ease;
}

.btn:hover:not(:disabled) {
  border-color: var(--border-strong);
  background: #fcfbf8;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn-primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.btn-primary:hover:not(:disabled) {
  border-color: var(--accent-hover);
  background: var(--accent-hover);
}

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--muted);
}

.btn-ghost:hover:not(:disabled) {
  border-color: transparent;
  background: rgba(29, 29, 27, 0.045);
  color: var(--text);
}

.btn-danger {
  color: var(--danger);
}

.btn-danger:hover:not(:disabled) {
  background: var(--danger-soft);
  color: var(--danger);
}

.btn-small {
  height: 32px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 12px;
}

.btn.is-mastered {
  border-color: var(--accent-border);
  background: var(--accent-soft);
  color: var(--accent);
}

.btn:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}

.icon-btn {
  width: 36px;
  height: 36px;
  flex: none;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
}

.icon-btn:hover:not(:disabled) {
  border-color: var(--border);
  background: var(--surface-2);
  color: var(--text);
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.view-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.view-tabs {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}

.view-tab {
  height: 32px;
  padding: 0 13px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  transition: background 150ms ease, color 150ms ease;
}

.view-tab:hover {
  background: var(--surface-2);
  color: var(--text);
}

.view-tab.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

.view-hint {
  color: var(--muted-2);
  font-size: 10.5px;
}

.view-panel[hidden] {
  display: none;
}

.mnemonic-toolbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin: 2px 0 16px;
}

.mnemonic-toolbar h2 {
  margin: 0;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.mnemonic-toolbar p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.mnemonic-controls {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 190px;
  gap: 8px;
  margin-bottom: 16px;
}

.caution-controls {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 170px 132px;
  gap: 8px;
  margin-bottom: 16px;
}

.mnemonic-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  align-items: start;
}

.mnemonic-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 180px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.mnemonic-card.pinned {
  border-color: var(--accent-border);
}

.caution-card.is-checked {
  background: var(--surface-2);
}

.caution-card.is-checked .mnemonic-title,
.caution-card.is-checked .mnemonic-content {
  color: var(--muted);
}

.caution-main {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
}

.caution-check {
  width: 26px;
  height: 26px;
  flex: none;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  background: var(--surface);
  color: transparent;
  transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
}

.caution-check .icon {
  width: 15px;
  height: 15px;
}

.caution-check:hover {
  border-color: var(--accent);
}

.caution-check.checked {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.mnemonic-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.mnemonic-title {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}

.mnemonic-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
  color: var(--muted-2);
  font-size: 10.5px;
}

.mnemonic-actions {
  display: flex;
  gap: 1px;
  flex: none;
}

.mnemonic-actions .icon-btn {
  width: 30px;
  height: 30px;
  border-radius: 7px;
}

.mnemonic-actions .icon-btn .icon {
  width: 15px;
  height: 15px;
}

.mnemonic-actions .icon-btn.is-pinned {
  color: var(--accent);
  background: var(--accent-soft);
}

.mnemonic-content {
  color: #3d3c37;
  font-size: 13.5px;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.mnemonic-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: auto;
}

.mnemonic-empty {
  grid-column: 1 / -1;
  min-height: 360px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 20px;
  border: 1px dashed var(--border-strong);
  border-radius: 14px;
  background: var(--surface);
  text-align: center;
}

.mnemonic-empty .empty-art {
  width: 84px;
  height: 84px;
  margin-bottom: 12px;
}

.mnemonic-empty h3 {
  margin: 0 0 6px;
  font-size: 17px;
  font-weight: 600;
}

.mnemonic-empty p {
  max-width: 320px;
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.7;
}

.field {
  display: block;
  margin-top: 12px;
}

.field > span {
  display: block;
  margin-bottom: 5px;
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
}

.form-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 190px;
  gap: 10px;
}

.text-input {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 13px;
}

.text-input:focus {
  border-color: var(--accent-border);
  background: var(--surface);
  outline: none;
}

.check-row {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
}

.backup-section {
  padding: 16px 0;
  border-top: 1px solid var(--border);
}

.backup-section:first-of-type {
  padding-top: 0;
  border-top: 0;
}

.backup-section h3 {
  margin: 0 0 4px;
  font-size: 14px;
  font-weight: 600;
}

.backup-section p {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.65;
}

.radio-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0;
}

.radio-card {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  flex: 1;
  min-width: 220px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface-2);
  cursor: pointer;
}

.radio-card input {
  margin-top: 2px;
  accent-color: var(--accent);
}

.radio-card strong {
  display: block;
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
}

.radio-card span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.55;
}

.backup-summary {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent-hover);
  font-size: 11.5px;
  line-height: 1.65;
  white-space: pre-wrap;
}

.stat {
  min-width: 0;
  padding: 17px 20px 16px;
  border-right: 1px solid var(--border);
}

.stat:last-child {
  border-right: 0;
}

.stat-label {
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 12px;
}

.stat-value {
  display: flex;
  align-items: baseline;
  gap: 3px;
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
}

.stat-value small {
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0;
}

.stat-note {
  margin-top: 2px;
  color: var(--muted-2);
  font-size: 10.5px;
}

.workspace {
  display: grid;
  grid-template-columns: 336px minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}

.sidebar {
  position: sticky;
  top: 20px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.search-wrap {
  position: relative;
}

.search-wrap > .icon {
  position: absolute;
  top: 50%;
  left: 12px;
  width: 16px;
  height: 16px;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

.search {
  width: 100%;
  height: 40px;
  padding: 0 34px 0 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text);
  font-size: 13px;
  transition: border-color 160ms ease, background 160ms ease;
}

.search::placeholder {
  color: var(--muted-2);
}

.search::-webkit-search-cancel-button {
  -webkit-appearance: none;
  appearance: none;
}

.search:focus {
  border-color: var(--accent-border);
  background: var(--surface);
  outline: none;
}

.search:disabled {
  background: var(--surface-2);
  color: var(--muted-2);
}

.search-clear {
  position: absolute;
  top: 50%;
  right: 5px;
  width: 28px;
  height: 28px;
  display: none;
  place-items: center;
  padding: 0;
  transform: translateY(-50%);
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
}

.search-clear:hover {
  background: rgba(29, 29, 27, 0.06);
  color: var(--text);
}

.search-clear.is-visible {
  display: grid;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 10px 0 9px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 30px;
  padding: 0 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  transition: background 150ms ease, color 150ms ease;
}

.chip:hover {
  background: rgba(29, 29, 27, 0.045);
  color: var(--text);
}

.chip.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

.chip .count {
  color: var(--muted-2);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}

.chip.active .count {
  color: var(--accent);
  opacity: 0.72;
}

.subject-select {
  width: 100%;
  height: 36px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  color: var(--text);
  font-size: 12.5px;
}

.subject-select:disabled {
  color: var(--muted-2);
}

.list-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 13px 3px 6px;
  color: var(--muted);
  font-size: 10.5px;
  letter-spacing: 0.02em;
}

.list-head span:last-child {
  font-variant-numeric: tabular-nums;
}

.question-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-height: calc(100vh - 380px);
  min-height: 96px;
  overflow-y: auto;
  padding-right: 2px;
}

.question-list::-webkit-scrollbar {
  width: 6px;
}

.question-list::-webkit-scrollbar-thumb {
  border-radius: 99px;
  background: #d9d6ce;
}

.question-list::-webkit-scrollbar-track {
  background: transparent;
}

.q-item {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  width: 100%;
  padding: 9px 9px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  text-align: left;
  transition: background 150ms ease, border-color 150ms ease;
}

.q-item:hover {
  background: var(--surface-2);
}

.q-item.active {
  border-color: var(--accent-border);
  background: var(--accent-soft);
}

.status-dot {
  width: 7px;
  height: 7px;
  flex: none;
  margin-top: 6px;
  border-radius: 50%;
  background: #c3c0b7;
}

.status-dot.wrong {
  background: var(--danger);
}

.status-dot.mastered {
  background: var(--accent);
}

.status-dot.correct {
  background: #78978d;
}

.q-item-body {
  min-width: 0;
  flex: 1;
}

.q-item-stem {
  display: -webkit-box;
  overflow: hidden;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  color: var(--text);
  font-size: 12.5px;
  line-height: 1.55;
}

.q-item.active .q-item-stem {
  color: #214f43;
}

.q-item-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 4px;
  color: var(--muted);
  font-size: 10.5px;
}

.q-item-index {
  flex: none;
  margin-top: 2px;
  color: var(--muted-2);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}

.list-empty {
  padding: 28px 12px;
  color: var(--muted-2);
  font-size: 12px;
  line-height: 1.7;
  text-align: center;
}

.main-panel {
  min-height: 540px;
  padding: 28px 30px 26px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.q-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 17px;
}

.q-index {
  color: var(--muted);
  font-size: 11.5px;
  letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums;
}

.q-index strong {
  color: var(--text);
  font-weight: 600;
}

.q-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.badge {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 10.5px;
  white-space: nowrap;
}

.badge-multi {
  border-color: #eadfc8;
  background: var(--warn-soft);
  color: var(--warn);
}

.badge-case {
  border-color: #ddcfe9;
  background: #f5eff9;
  color: #6d4f86;
}

.case-panel {
  margin: 0 0 18px;
  overflow: hidden;
  border: 1px solid #e4d9ec;
  border-radius: 12px;
  background: #fbf8fd;
}

.case-panel summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  list-style: none;
  cursor: pointer;
}

.case-panel summary::-webkit-details-marker {
  display: none;
}

.case-toggle {
  width: 18px;
  height: 18px;
  flex: none;
  display: grid;
  place-items: center;
  color: #6d4f86;
  transition: transform 150ms ease;
}

.case-toggle .icon {
  width: 14px;
  height: 14px;
}

.case-panel[open] .case-toggle {
  transform: rotate(90deg);
}

.case-title {
  min-width: 0;
  color: var(--text);
  font-size: 12.5px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.case-progress {
  margin-left: auto;
  color: var(--muted);
  font-size: 10.5px;
  white-space: nowrap;
}

.case-text {
  padding: 0 14px 13px;
  color: #3d3c37;
  font-size: 13.5px;
  line-height: 1.82;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.case-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 0 14px 13px;
}

.case-actions .btn {
  height: 30px;
  padding: 0 9px;
  font-size: 11px;
}

.q-stem {
  margin: 0;
  font-size: 18px;
  font-weight: 500;
  line-height: 1.78;
  letter-spacing: -0.012em;
  overflow-wrap: anywhere;
}

.q-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}

.tag {
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 10.5px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 20px 0 20px;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--surface);
  text-align: left;
  transition: background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
}

.option:hover:not(:disabled) {
  border-color: var(--border-strong);
  background: var(--surface-2);
}

.option:disabled {
  cursor: default;
}

.option-key {
  width: 26px;
  height: 26px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 600;
  transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
}

.option-text {
  flex: 1;
  padding-top: 1px;
  color: var(--text);
  font-size: 14px;
  line-height: 1.62;
  overflow-wrap: anywhere;
}

.option-mark {
  width: 17px;
  height: 17px;
  flex: none;
  margin-top: 4px;
  color: transparent;
}

.option.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px rgba(47, 111, 94, 0.08);
}

.option.selected .option-key {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.option.correct {
  border-color: #9bc0b1;
  background: #eef6f1;
}

.option.correct .option-key {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.option.correct .option-mark {
  color: var(--accent);
}

.option.wrong {
  border-color: var(--danger-border);
  background: var(--danger-soft);
}

.option.wrong .option-key {
  border-color: var(--danger);
  background: var(--danger);
  color: #fff;
}

.option.wrong .option-mark {
  color: var(--danger);
}

.q-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.q-actions .spacer {
  flex: 1;
  min-width: 8px;
}

.hint {
  color: var(--muted);
  font-size: 11.5px;
}

.nav-arrows {
  display: flex;
  gap: 2px;
}

.feedback,
.feedback-hint {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

.feedback-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 600;
}

.feedback-head .icon {
  width: 19px;
  height: 19px;
}

.feedback.ok .feedback-head {
  color: var(--accent);
}

.feedback.bad .feedback-head {
  color: var(--danger);
}

.feedback-answer {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
}

.feedback-answer strong {
  color: var(--text);
  font-weight: 600;
  letter-spacing: 0.06em;
}

.feedback-exp {
  margin-top: 12px;
  color: #3d3c37;
  font-size: 13.5px;
  line-height: 1.82;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.feedback-hint {
  color: var(--muted);
  font-size: 12px;
}

.note-block {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.note-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.note-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
  font-size: 12.5px;
  font-weight: 600;
}

.note-label .icon {
  width: 15px;
  height: 15px;
  color: var(--muted);
}

.note-status {
  color: var(--muted);
  font-size: 10.5px;
}

.note-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.note-area {
  width: 100%;
  min-height: 112px;
  padding: 12px 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 13px;
  line-height: 1.75;
  resize: vertical;
  transition: background 150ms ease, border-color 150ms ease;
}

.note-area::placeholder {
  color: var(--muted-2);
}

.note-area:focus {
  border-color: var(--accent-border);
  background: var(--surface);
  outline: none;
}

.note-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 6px;
  color: var(--muted-2);
  font-size: 10px;
}

.empty {
  min-height: 540px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 38px 20px;
  text-align: center;
}

.empty-art {
  width: 112px;
  height: 112px;
  margin-bottom: 18px;
  color: var(--accent);
  opacity: 0.88;
}

.empty h2 {
  margin: 0 0 7px;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.empty p {
  max-width: 330px;
  margin: 0 0 20px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.75;
}

.empty-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.empty.small {
  min-height: 420px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(29, 29, 27, 0.34);
  backdrop-filter: blur(2px);
  animation: overlayIn 160ms ease both;
}

.modal {
  width: min(680px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: 0 28px 90px rgba(20, 20, 18, 0.22);
  animation: modalIn 180ms ease both;
}

.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
}

.modal h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.modal-sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.6;
}

.dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 128px;
  padding: 20px;
  border: 1.5px dashed var(--border-strong);
  border-radius: 12px;
  background: var(--surface-2);
  text-align: center;
  transition: border-color 150ms ease, background 150ms ease;
}

.dropzone:hover,
.dropzone.dragover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.dropzone .icon {
  width: 26px;
  height: 26px;
  margin-bottom: 7px;
  color: var(--muted);
}

.dropzone strong {
  display: block;
  font-size: 13px;
  font-weight: 600;
}

.dropzone span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
}

.file-name {
  margin-top: 7px;
  color: var(--accent);
  font-size: 11px;
  overflow-wrap: anywhere;
}

.image-preview {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
}

.image-preview[hidden] {
  display: none;
}

.image-preview img {
  width: 118px;
  height: 82px;
  flex: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #fff;
  object-fit: contain;
}

.ocr-status {
  min-width: 0;
  flex: 1;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.6;
}

.ocr-status strong {
  display: block;
  margin-bottom: 2px;
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
}

.ocr-progress {
  height: 4px;
  margin-top: 7px;
  overflow: hidden;
  border-radius: 99px;
  background: #e8e5dd;
}

.ocr-progress > span {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
  transition: width 180ms ease;
}

.ocr-tip {
  margin-top: 7px;
  color: var(--muted-2);
  font-size: 10.5px;
  line-height: 1.6;
}

.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 15px 0;
  color: var(--muted-2);
  font-size: 10.5px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.import-area {
  width: 100%;
  min-height: 158px;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.65;
  resize: vertical;
}

.import-area:focus {
  border-color: var(--accent-border);
  background: var(--surface);
  outline: none;
}

.template-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.template-row span {
  color: var(--muted-2);
  font-size: 10.5px;
}

.format {
  margin-top: 9px;
  color: var(--muted);
  font-size: 11.5px;
}

.format summary {
  width: fit-content;
  color: var(--muted);
  cursor: pointer;
}

.format summary:hover {
  color: var(--text);
}

.format pre {
  max-height: 220px;
  margin: 8px 0 0;
  padding: 11px 12px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface-2);
  color: #4a4943;
  font-family: var(--font-mono);
  font-size: 10.5px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.import-result {
  margin-top: 12px;
  padding: 9px 11px;
  border-radius: 8px;
  font-size: 11.5px;
  line-height: 1.65;
  white-space: pre-wrap;
}

.import-result.ok {
  background: var(--accent-soft);
  color: var(--accent-hover);
}

.import-result.error {
  background: var(--danger-soft);
  color: var(--danger);
}

.modal-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 17px;
}

.modal-foot .spacer {
  flex: 1;
  min-width: 6px;
}

.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 20px;
  color: var(--muted-2);
  font-size: 10.5px;
}

.app-version {
  margin-left: 6px;
  color: var(--muted-2);
  font-variant-numeric: tabular-nums;
}

.keys {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

kbd {
  min-width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 5px;
  border: 1px solid var(--border);
  border-bottom-color: var(--border-strong);
  border-radius: 5px;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--font-ui);
  font-size: 9.5px;
  line-height: 1;
}

.toast-root {
  position: fixed;
  bottom: 22px;
  left: 50%;
  z-index: 140;
  display: flex;
  flex-direction: column;
  gap: 7px;
  transform: translateX(-50%);
  pointer-events: none;
}

.toast {
  max-width: min(88vw, 420px);
  padding: 9px 13px;
  border-radius: 9px;
  background: #232320;
  color: #fff;
  font-size: 12px;
  line-height: 1.55;
  text-align: center;
  box-shadow: 0 10px 30px rgba(20, 20, 18, 0.2);
  animation: toastIn 180ms ease both;
}

.toast.error {
  background: #8f3a31;
}

.toast.info {
  background: #2f4f46;
}

@keyframes overlayIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.992);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 980px) {
  .app {
    padding: 22px 20px 30px;
  }

  .workspace {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: static;
    order: 2;
  }

  .main-panel {
    order: 1;
  }

  .question-list {
    max-height: 300px;
  }

  .mnemonic-grid {
    grid-template-columns: 1fr;
  }

  .stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .stat:nth-child(2) {
    border-right: 0;
  }

  .stat:nth-child(1),
  .stat:nth-child(2) {
    border-bottom: 1px solid var(--border);
  }
}

@media (max-width: 640px) {
  .app {
    padding: 16px 14px 26px;
  }

  .topbar {
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    margin-bottom: 16px;
  }

  .top-actions {
    width: 100%;
  }

  .top-actions .btn {
    flex: 1;
  }

  .view-bar {
    align-items: flex-start;
    flex-direction: column;
    gap: 6px;
  }

  .view-hint {
    display: none;
  }

  .mnemonic-toolbar {
    align-items: flex-start;
    flex-direction: column;
    gap: 10px;
  }

  .mnemonic-controls {
    grid-template-columns: 1fr;
  }

  .caution-controls {
    grid-template-columns: 1fr;
  }

  .mnemonic-card {
    min-height: 0;
    padding: 15px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .radio-card {
    min-width: 100%;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 12px;
  }

  .brand h1 {
    font-size: 18px;
  }

  .stats {
    margin-bottom: 14px;
  }

  .stat {
    padding: 14px 15px;
  }

  .stat-value {
    font-size: 23px;
  }

  .main-panel {
    min-height: 480px;
    padding: 19px 16px 20px;
    border-radius: 14px;
  }

  .q-head {
    align-items: flex-start;
  }

  .q-tools {
    gap: 4px;
  }

  .q-stem {
    font-size: 16px;
    line-height: 1.75;
  }

  .option {
    padding: 12px;
    gap: 10px;
  }

  .option-text {
    font-size: 13.5px;
  }

  .q-actions {
    gap: 6px;
  }

  .q-actions .hint {
    display: none;
  }

  .feedback-exp {
    font-size: 13px;
  }

  .empty {
    min-height: 480px;
    padding: 30px 16px;
  }

  .empty-art {
    width: 96px;
    height: 96px;
  }

  .modal-overlay {
    padding: 10px;
  }

  .modal {
    max-height: 94vh;
    padding: 18px;
    border-radius: 14px;
  }

  .footer {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

  const DEMO_CAUTIONS = [
    {
      title: "先看最后问的是“正确”还是“错误”",
      content: "题干再长，先扫一眼最后一句。问“错误的是”时，不要条件反射选正确项。",

    },
    {

      subject: "考试策略",
      tags: ["X型题", "时间分配"],
    },
    {
      title: "病例题先抓三件事",
      content: "主诉和病程、生命体征、禁忌证。先定急危重，再选检查和治疗。",
      subject: "临床思维",
      tags: ["病例题"],
    },
    {
      title: "计算结果检查单位和正负号",
      content: "尤其是 mmol/L、mg/dL、ml/min 和阴离子间隙，算完回头看一眼单位。",
      subject: "通用",
      tags: ["计算", "单位"],
    },
  ];

  const els = {
    stats: document.getElementById("stats"),
    filters: document.getElementById("filters"),
    subjectFilter: document.getElementById("subjectFilter"),
    searchInput: document.getElementById("searchInput"),
    clearSearch: document.getElementById("clearSearch"),
    listLabel: document.getElementById("listLabel"),
    listCount: document.getElementById("listCount"),
    questionList: document.getElementById("questionList"),
    main: document.getElementById("mainPanel"),
    importBtn: document.getElementById("importBtn"),
    backupBtn: document.getElementById("backupBtn"),
    practiceView: document.getElementById("practiceView"),
    mnemonicsView: document.getElementById("mnemonicsView"),
    cautionsView: document.getElementById("cautionsView"),
    viewHint: document.getElementById("viewHint"),
    newMnemonicBtn: document.getElementById("newMnemonicBtn"),
    newCautionBtn: document.getElementById("newCautionBtn"),
    mnemonicSearch: document.getElementById("mnemonicSearch"),
    clearMnemonicSearch: document.getElementById("clearMnemonicSearch"),
    mnemonicSubjectFilter: document.getElementById("mnemonicSubjectFilter"),
    mnemonicGrid: document.getElementById("mnemonicGrid"),
    cautionSearch: document.getElementById("cautionSearch"),
    clearCautionSearch: document.getElementById("clearCautionSearch"),
    cautionSubjectFilter: document.getElementById("cautionSubjectFilter"),
    cautionStatusFilter: document.getElementById("cautionStatusFilter"),
    cautionGrid: document.getElementById("cautionGrid"),
    modalRoot: document.getElementById("modalRoot"),
    toastRoot: document.getElementById("toastRoot"),
    liveRegion: document.getElementById("liveRegion"),
  };

  const state = {
    questions: [],
    mnemonics: [],
    cautions: [],
    currentId: null,
    filter: "all",
    subject: "all",
    query: "",
    view: "practice",
  };

  const ui = {
    selection: [],
    revealed: false,
    noteTimer: null,
    noteDirty: false,
    noteTarget: null,
    modalOpen: false,
    lastFocus: null,
    mnemonicQuery: "",
    mnemonicSubject: "all",
    editingMnemonicId: null,
    cautionQuery: "",
    cautionSubject: "all",
    cautionStatus: "all",
    editingCautionId: null,
    backupPreview: null,
  };

  let storageAvailable = true;
  let storageWarned = false;
  let ocrWorkerPromise = null;
  let ocrBusy = false;
  let tesseractLoadingPromise = null;

  function $(selector, root = document) {
    return root.querySelector(selector);
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char];
    });
  }

  function icon(name, className = "icon") {
    return `<svg class="${className}" aria-hidden="true"><use href="#icon-${name}"></use></svg>`;
  }

  function letterAt(index) {
    return String.fromCharCode(65 + index);
  }

  function uid() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return window.crypto.randomUUID();
    }
    return `q-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
  }

  function numberToAnswer(number, optionCount) {
    if (!Number.isFinite(number)) return "";
    if (number === 0) return optionCount > 0 ? "A" : "";
    if (number >= 1 && number <= optionCount) return letterAt(number - 1);
    return "";
  }

  function normalizeAnswer(value, optionCount) {
    if (value === null || value === undefined) return "";
    if (typeof value === "number") return numberToAnswer(value, optionCount);

    const text = String(value).trim().toUpperCase();
    if (!text) return "";

    if (/^\d+(?:\s*[,，、]\s*\d+)*$/.test(text)) {
      const numbers = text.split(/[,，、\s]+/).filter(Boolean).map(Number);
      const letters = numbers.map((n) => numberToAnswer(n, optionCount)).filter(Boolean);
      return [...new Set(letters)].sort().join("");
    }

    const letters = text.match(/[A-F]/g) || [];
    return [...new Set(letters)]
      .filter((letter) => letter.charCodeAt(0) - 65 < optionCount)
      .sort()
      .join("");
  }

  function normalizeStem(stem) {
    return String(stem ?? "")
      .replace(/\s+/g, "")
      .replace(/[，。；：、,.!?！？;:（）()【】\[\]]/g, "")
      .toLowerCase();
  }

  function truncate(value, maxLength) {
    const text = String(value ?? "");
    return text.length > maxLength ? `${text.slice(0, maxLength - 1)}…` : text;
  }

  function getStatus(question) {
    if (question.mastered) return { key: "mastered", label: "已掌握" };
    if (question.attempts > 0 && question.lastResult === "wrong") {
      return { key: "wrong", label: "做错" };
    }
    if (question.attempts > 0) return { key: "correct", label: "已做对" };
    return { key: "new", label: "未做" };
  }

  function normalizeStoredQuestion(raw) {
    if (!raw || typeof raw !== "object") return null;
    const stem = String(raw.stem ?? raw.question ?? raw.title ?? "").trim();
    if (!stem) return null;

    let options = [];
    if (Array.isArray(raw.options)) {
      options = raw.options.map((item, index) => {
        if (item && typeof item === "object") {
          return {
            key: letterAt(index),
            text: String(item.text ?? item.label ?? item.content ?? "").trim(),
          };
        }
        return { key: letterAt(index), text: String(item ?? "").trim() };
      });
    } else if (raw.options && typeof raw.options === "object") {
      options = Object.keys(raw.options)
        .filter((key) => /^[A-F]$/i.test(key))
        .sort()
        .map((key) => ({ key: key.toUpperCase(), text: String(raw.options[key] ?? "").trim() }));
    }
    options = options.filter((option) => option.text);
    if (options.length < 2) return null;
    options = options.map((option, index) => ({ key: letterAt(index), text: option.text }));

    const answer = normalizeAnswer(raw.answer, options.length);
    const tags = Array.isArray(raw.tags)
      ? raw.tags.map(String)
      : String(raw.tags ?? "")
          .split(/[,，、;；]/)
          .map((tag) => tag.trim())
          .filter(Boolean);

    return {
      id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
      stem,
      options,
      answer,
      explanation: String(raw.explanation ?? "").trim(),
      subject: String(raw.subject ?? "未分类").trim() || "未分类",
      tags: [...new Set(tags)].slice(0, 6),
      caseId: typeof raw.caseId === "string" && raw.caseId ? raw.caseId : null,
      caseTitle: String(raw.caseTitle ?? "").trim(),
      caseText: String(raw.caseText ?? raw.case ?? "").trim(),
      caseOrder: Number(raw.caseOrder) || 0,
      caseTotal: Number(raw.caseTotal) || 0,
      note: String(raw.note ?? ""),
      attempts: Number(raw.attempts) || 0,
      correctCount: Number(raw.correctCount) || 0,
      lastResult: raw.lastResult === "correct" || raw.lastResult === "wrong" ? raw.lastResult : null,
      mastered: Boolean(raw.mastered),
      createdAt: Number(raw.createdAt) || Date.now(),
      updatedAt: Number(raw.updatedAt) || Date.now(),
    };
  }

  function normalizeMnemonic(raw) {
    if (!raw || typeof raw !== "object") return null;
    const title = String(raw.title ?? raw.name ?? "").trim();
    const content = String(raw.content ?? raw.text ?? raw.body ?? "").trim();
    if (!title || !content) return null;
    const tags = Array.isArray(raw.tags)
      ? raw.tags.map(String)
      : String(raw.tags ?? "")
          .split(/[,，、;；]/)
          .map((tag) => tag.trim())
          .filter(Boolean);

    return {
      id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
      title,
      content,
      subject: String(raw.subject ?? "未分类").trim() || "未分类",
      tags: [...new Set(tags)].slice(0, 6),
      pinned: Boolean(raw.pinned),
      createdAt: Number(raw.createdAt) || Date.now(),
      updatedAt: Number(raw.updatedAt) || Date.now(),
    };
  }

  function normalizeCaution(raw) {
    const base = normalizeMnemonic(raw);
    if (!base) return null;
    return {
      ...base,
      checked: Boolean(raw.checked),
    };
  }

  function loadState() {
    try {
      const probe = "__cuotiben_probe__";
      window.localStorage.setItem(probe, "1");
      window.localStorage.removeItem(probe);
    } catch (error) {
      storageAvailable = false;
      return;
    }

    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      const list = Array.isArray(data) ? data : data && data.questions;
      if (!Array.isArray(list)) return;
      state.questions = list.map(normalizeStoredQuestion).filter(Boolean);

      if (data && !Array.isArray(data)) {
        if (FILTERS.some((filter) => filter.key === data.filter)) state.filter = data.filter;
        if (typeof data.subject === "string") state.subject = data.subject;
        if (typeof data.currentId === "string") state.currentId = data.currentId;
        if (Array.isArray(data.mnemonics)) {
          state.mnemonics = data.mnemonics.map(normalizeMnemonic).filter(Boolean);
        }
        if (Array.isArray(data.cautions)) {
          state.cautions = data.cautions.map(normalizeCaution).filter(Boolean);
        }
        if (data.view === "mnemonics" || data.view === "cautions") {
          state.view = data.view;
        }
      }

      if (state.questions.length && !state.questions.some((q) => q.id === state.currentId)) {
        state.currentId = state.questions[0].id;
      }
    } catch (error) {
      console.warn("读取本地数据失败", error);
    }
  }

  function saveState() {
    if (!storageAvailable) return false;
    try {
      window.localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          version: 3,
          questions: state.questions,
          mnemonics: state.mnemonics,
          cautions: state.cautions,
          currentId: state.currentId,
          filter: state.filter,
          subject: state.subject,
          view: state.view,
        }),
      );
      return true;
    } catch (error) {
      if (!storageWarned) {
        storageWarned = true;
        toast("本地存储空间不足，最近的修改可能无法保存", "error");
      }
      return false;
    }
  }

  function getFiltered() {
    const query = state.query.trim().toLowerCase();
    return state.questions.filter((question) => {
      if (state.subject !== "all" && question.subject !== state.subject) return false;

      const status = getStatus(question);
      if (state.filter === "new" && status.key !== "new") return false;
      if (state.filter === "wrong" && status.key !== "wrong") return false;
      if (state.filter === "mastered" && !question.mastered) return false;

      if (query) {
        const haystack = [
          question.stem,
          question.subject,
          question.tags.join(" "),
          question.note,
          question.explanation,
          question.options.map((option) => option.text).join(" "),
        ]
          .join(" ")
          .toLowerCase();
        if (!haystack.includes(query)) return false;
      }
      return true;
    });
  }

  function getCurrentQuestion() {
    const list = getFiltered();
    if (!list.length) {
      state.currentId = null;
      return null;
    }
    if (!list.some((question) => question.id === state.currentId)) {
      state.currentId = list[0].id;
    }
    return list.find((question) => question.id === state.currentId) || null;
  }

  function getFilteredMnemonics() {
    const query = ui.mnemonicQuery.trim().toLowerCase();
    return state.mnemonics
      .filter((mnemonic) => {
        if (ui.mnemonicSubject !== "all" && mnemonic.subject !== ui.mnemonicSubject) {
          return false;
        }
        if (!query) return true;
        const haystack = [
          mnemonic.title,
          mnemonic.content,
          mnemonic.subject,
          mnemonic.tags.join(" "),
        ]
          .join(" ")
          .toLowerCase();
        return haystack.includes(query);
      })
      .sort((a, b) => {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return b.updatedAt - a.updatedAt;
      });
  }

  function renderView() {
    const isMnemonics = state.view === "mnemonics";
    const isCautions = state.view === "cautions";
    els.practiceView.hidden = isMnemonics || isCautions;
    els.mnemonicsView.hidden = !isMnemonics;
    els.cautionsView.hidden = !isCautions;
    document.querySelectorAll(".view-tab").forEach((button) => {
      const active = button.dataset.view === state.view;
      button.classList.toggle("active", active);
      button.setAttribute("aria-selected", String(active));
    });
    if (isMnemonics) {
      const subjects = new Set(state.mnemonics.map((item) => item.subject));
      els.viewHint.textContent = `${state.mnemonics.length} 条口诀 · ${subjects.size} 个学科`;

      const pending = state.cautions.filter((item) => !item.checked).length;

            ${

                    .join("")}</div>`
                : ""
            }
          </article>

      })
      .join("");
  }

  function getFilteredCautions() {
    const query = ui.cautionQuery.trim().toLowerCase();
    return state.cautions
      .filter((caution) => {
        if (ui.cautionSubject !== "all" && caution.subject !== ui.cautionSubject) {
          return false;
        }
        if (ui.cautionStatus === "pending" && caution.checked) return false;
        if (ui.cautionStatus === "done" && !caution.checked) return false;
        if (!query) return true;
        const haystack = [
          caution.title,
          caution.content,
          caution.subject,
          caution.tags.join(" "),
        ]
          .join(" ")
          .toLowerCase();
        return haystack.includes(query);
      })
      .sort((a, b) => {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return b.updatedAt - a.updatedAt;
      });
  }

      ...new Set(state.cautions.map((caution) => caution.subject)),

  function renderAll() {
    const previousId = state.currentId;
    const current = getCurrentQuestion();
    if (current && state.currentId !== previousId) saveState();

    renderView();
    renderStats();
    renderFilters();
    renderSubjects();
    renderList();
    renderQuestion(current);
    renderMnemonics();
    renderCautions();
    updateListMeta();

    els.searchInput.disabled = state.questions.length === 0;
    els.clearSearch.classList.toggle("is-visible", Boolean(state.query));
  }

  function renderStats() {
    const total = state.questions.length;
    const attempted = state.questions.filter((question) => question.attempts > 0).length;
    const totalAttempts = state.questions.reduce((sum, question) => sum + question.attempts, 0);
    const totalCorrect = state.questions.reduce((sum, question) => sum + question.correctCount, 0);
    const due = state.questions.filter(
      (question) => question.lastResult === "wrong" && !question.mastered,
    ).length;
    const mastered = state.questions.filter((question) => question.mastered).length;
    const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : null;

    els.stats.innerHTML = `
      <div class="stat">
        <div class="stat-label">题库</div>
        <div class="stat-value">${total}<small>题</small></div>
      </div>
      <div class="stat">
        <div class="stat-label">已练</div>
        <div class="stat-value">${attempted}<small>题</small></div>
        <div class="stat-note">至少作答一次</div>
      </div>
      <div class="stat">
        <div class="stat-label">正确率</div>
        <div class="stat-value">${accuracy === null ? "—" : accuracy}<small>${accuracy === null ? "" : "%"}</small></div>
        <div class="stat-note">${totalAttempts > 0 ? `${totalCorrect} / ${totalAttempts} 次作答` : "完成答题后显示"}</div>
      </div>
      <div class="stat">
        <div class="stat-label">待复习</div>
        <div class="stat-value">${due}<small>题</small></div>
        <div class="stat-note">${mastered} 题已掌握</div>
      </div>
    `;
  }

  function renderFilters() {
    const counts = {
      all: state.questions.length,
      new: state.questions.filter((question) => getStatus(question).key === "new").length,
      wrong: state.questions.filter((question) => getStatus(question).key === "wrong").length,
      mastered: state.questions.filter((question) => question.mastered).length,
    };

    els.filters.innerHTML = FILTERS.map(
      (filter) => `
        <button
          class="chip ${state.filter === filter.key ? "active" : ""}"
          type="button"
          data-filter="${filter.key}"
          aria-pressed="${state.filter === filter.key}"
        >
          ${filter.label}<span class="count">${counts[filter.key]}</span>
        </button>
      `,
    ).join("");
  }

  function renderSubjects() {
    const subjects = [...new Set(state.questions.map((question) => question.subject).filter(Boolean))].sort(
      (a, b) => a.localeCompare(b, "zh-Hans-CN"),
    );
    if (state.subject !== "all" && !subjects.includes(state.subject)) {
      state.subject = "all";
    }
    els.subjectFilter.innerHTML =
      `<option value="all">全部学科</option>` +
      subjects.map((subject) => `<option value="${escapeHtml(subject)}">${escapeHtml(subject)}</option>`).join("");
    els.subjectFilter.value = state.subject;
    els.subjectFilter.disabled = state.questions.length === 0;
  }

  function renderList() {
    const list = getFiltered();
    if (!state.questions.length) {
      els.questionList.innerHTML = `<div class="list-empty">题库还是空的<br>导入后，题目会出现在这里。</div>`;
      return;
    }
    if (!list.length) {
      els.questionList.innerHTML = `<div class="list-empty">没有符合条件的题目<br>试试更换筛选条件或搜索词。</div>`;
      return;

    els.questionList.innerHTML = list
      .map((question, index) => {

        return `
          <button

  function updateListMeta() {
    const list = getFiltered();
    const filter = FILTERS.find((item) => item.key === state.filter) || FILTERS[0];
    const subject = state.subject === "all" ? "" : ` · ${state.subject}`;
    els.listLabel.textContent = `${filter.label}${subject}`;
    els.listCount.textContent = `${list.length} / ${state.questions.length} 题`;
  }

  function emptyStateHTML(title, text, showDemo) {
    const actions = showDemo
      ? `
        <button class="btn btn-primary" type="button" data-action="open-import">
          ${icon("upload")}导入错题
        </button>
        <button class="btn" type="button" data-action="load-demo">载入示例</button>

      : `
        <button class="btn" type="button" data-action="clear-filters">清除筛选</button>
      `;

    return `
      <div class="empty">
        <svg class="empty-art" viewBox="0 0 120 120" fill="none" aria-hidden="true">
          <rect x="27" y="17" width="66" height="86" rx="10" stroke="currentColor" stroke-width="1.5"></rect>
          <path d="M41 39h38M41 53h38M41 67h23" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
          <path d="M78 17v18l-7-4-7 4V17" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
          <circle cx="82" cy="82" r="16" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></circle>
          <path d="m75 82 5 5 9-10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>

        <p>${escapeHtml(text)}</p>
        <div class="empty-actions">${actions}</div>
      </div>
    `;
  }

  function renderQuestion(question) {
    if (!state.questions.length) {
      els.main.innerHTML = emptyStateHTML(
        "还没有题目",
        "导入你手头的错题，或先载入几道示例看看效果。",
        true,
      );
      return;
    }

    if (!question) {
      els.main.innerHTML = emptyStateHTML(
        "没有符合条件的题目",
        "换个筛选条件，或清除搜索词再试。",
        false,
      );
      return;
    }

    const list = getFiltered();
    const index = list.findIndex((item) => item.id === question.id);
    const answerLetters = new Set(question.answer.split(""));
    const selected = new Set(ui.selection);
    const isMulti = question.answer.length > 1;
    const isCorrect = ui.selection.slice().sort().join("") === question.answer;
    const status = getStatus(question);
    const noteStatus = ui.noteDirty ? "保存中…" : question.note ? "已保存" : "自动保存";

    const optionsHTML = question.options
      .map((option, optionIndex) => {
        const key = option.key || letterAt(optionIndex);
        const isSelected = selected.has(key);
        const isCorrectOption = answerLetters.has(key);
        let className = "option";
        let mark = `<span class="option-mark"></span>`;

        if (ui.revealed) {
          if (isCorrectOption) {
            className += " correct";
            mark = icon("check", "option-mark");
          } else if (isSelected) {
            className += " wrong";
            mark = icon("x", "option-mark");
          }
        } else if (isSelected) {
          className += " selected";
        }

        return `
          <button
            class="${className}"
            type="button"
            data-key="${key}"
            aria-pressed="${isSelected}"
            ${ui.revealed ? "disabled" : ""}
          >
            <span class="option-key">${key}</span>
            <span class="option-text">${escapeHtml(option.text)}</span>
            ${mark}
          </button>
        `;
      })
      .join("");

    const feedbackHTML = ui.revealed
      ? `
        <div class="feedback ${isCorrect ? "ok" : "bad"}" id="feedback" role="status">
          <div class="feedback-head">
            ${icon(isCorrect ? "check-circle" : "alert-circle")}
            ${isCorrect ? "回答正确" : "回答错误"}
          </div>
          <div class="feedback-answer">
            正确答案：<strong>${escapeHtml(question.answer || "未设置")}</strong>
            ${ui.selection.length ? `　你的答案：<strong>${escapeHtml(ui.selection.join(""))}</strong>` : ""}
          </div>
          <div class="feedback-exp">${escapeHtml(question.explanation || "暂无解析。")}</div>
        </div>
      `
      : `
        <div class="feedback-hint" id="feedbackHint">
          ${
            question.answer
              ? isMulti
                ? "多选题：选择所有正确选项后提交。"
                : "选择一个答案后提交。"
              : "本题缺少标准答案，暂时无法判分。"
          }
        </div>
      `;

    const submitDisabled = !question.answer || ui.selection.length === 0;
    const primaryAction = ui.revealed
      ? `<button class="btn btn-primary" type="button" data-action="next">下一题 ${icon("arrow-right")}</button>
         <button class="btn" type="button" data-action="retry">再做一次</button>`
      : `<button class="btn btn-primary" type="button" data-action="submit" ${submitDisabled ? "disabled" : ""}>提交答案</button>
         <span class="hint">${question.answer ? "答错会自动记录到待复习" : "请先补充标准答案"}</span>`;

    const caseQuestions = question.caseId
      ? state.questions
          .filter((item) => item.caseId === question.caseId)
          .sort((a, b) => a.caseOrder - b.caseOrder)
      : [];
    const caseIndex = Math.max(
      0,
      caseQuestions.findIndex((item) => item.id === question.id),
    );
    const caseTotal = caseQuestions.length || question.caseTotal || 0;
    const caseHTML = question.caseId
      ? `
        <details class="case-panel" open>
          <summary>
            <span class="case-toggle">${icon("chevron-right")}</span>
            <span class="badge badge-case">病例题</span>
            <span class="case-title">${escapeHtml(question.caseTitle || "病例题")}</span>
            <span class="case-progress">本病例第 ${caseIndex + 1}/${caseTotal} 问</span>
          </summary>
          <div class="case-text">${escapeHtml(question.caseText || "暂无病例描述")}</div>
          <div class="case-actions">
            <button class="btn" type="button" data-action="case-prev" ${caseIndex <= 0 ? "disabled" : ""}>上一问</button>
            <button class="btn" type="button" data-action="case-next" ${caseIndex >= caseTotal - 1 ? "disabled" : ""}>下一问</button>
          </div>
        </details>
      `
      : "";

    els.main.innerHTML = `
      <div class="q-head">
        <div class="q-index">第 <strong>${index + 1}</strong> 题 <span>/ 共 ${list.length} 题</span></div>
        <div class="q-tools">
          <span class="badge">${escapeHtml(question.subject)}</span>
          ${isMulti ? `<span class="badge badge-multi">多选</span>` : ""}
          <button
            class="btn btn-small ${question.mastered ? "is-mastered" : ""}"
            type="button"
            data-action="master"
          >
            ${icon(question.mastered ? "check-circle" : "check")}
            ${question.mastered ? "已掌握" : "标记掌握"}
          </button>
          <button class="icon-btn" type="button" data-action="delete" aria-label="删除本题" title="删除本题">
            ${icon("trash")}
          </button>
        </div>
      </div>

      ${caseHTML}
      <h2 class="q-stem">${escapeHtml(question.stem)}</h2>
      ${
        question.tags.length
          ? `<div class="q-tags">${question.tags
              .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
              .join("")}</div>`
          : ""
      }

      <div class="options" role="group" aria-label="选项">${optionsHTML}</div>

      <div class="q-actions">
        ${primaryAction}
        <span class="spacer"></span>
        <div class="nav-arrows">
          <button class="icon-btn" type="button" data-action="prev" aria-label="上一题" title="上一题">
            ${icon("chevron-left")}
          </button>
          <button class="icon-btn" type="button" data-action="next" aria-label="下一题" title="下一题">
            ${icon("chevron-right")}
          </button>
        </div>
      </div>

      ${feedbackHTML}

      <div class="note-block">

  function navigate(delta) {
    const list = getFiltered();
    if (!list.length) return;
    const currentIndex = list.findIndex((question) => question.id === state.currentId);
    const nextIndex =
      currentIndex === -1
        ? delta > 0
          ? 0
          : list.length - 1
        : (currentIndex + delta + list.length) % list.length;
    selectQuestion(list[nextIndex].id);
  }

  function navigateCase(delta) {
    const question = getCurrentQuestion();
    if (!question || !question.caseId) return;
    const caseQuestions = state.questions
      .filter((item) => item.caseId === question.caseId)
      .sort((a, b) => a.caseOrder - b.caseOrder);
    const index = caseQuestions.findIndex((item) => item.id === question.id);
    const target = caseQuestions[index + delta];
    if (!target) return;

    state.filter = "all";
    state.subject = "all";
    state.query = "";
    els.searchInput.value = "";
    selectQuestion(target.id);
  }

  function toggleOption(key) {
    const question = getCurrentQuestion();
    if (!question || ui.revealed) return;
    if (!question.answer) {
      toast("本题缺少标准答案，暂时不能作答", "error");
      return;
    }

    if (question.answer.length > 1) {
      if (ui.selection.includes(key)) {
        ui.selection = ui.selection.filter((item) => item !== key);
      } else {
        ui.selection = [...ui.selection, key].sort();
      }
    } else {
      ui.selection = [key];
    }

    renderQuestion(question);
    els.liveRegion.textContent = ui.selection.length
      ? `已选择 ${ui.selection.join("")}`
      : "已取消选择";

    window.requestAnimationFrame(() => {
      const option = els.main.querySelector(`.option[data-key="${key}"]`);
      if (option) option.focus({ preventScroll: true });
    });
  }

  function submitAnswer() {
    if (ui.revealed) return;
    const question = getCurrentQuestion();
    if (!question) return;
    if (!question.answer) {
      toast("本题缺少标准答案，暂时不能判分", "error");
      return;
    }
    if (!ui.selection.length) {
      toast("请先选择答案");
      return;
    }

    const selected = ui.selection.slice().sort().join("");
    const correct = selected === question.answer;
    question.attempts += 1;
    question.correctCount += correct ? 1 : 0;
    question.lastResult = correct ? "correct" : "wrong";
    question.updatedAt = Date.now();
    ui.revealed = true;
    saveState();
    renderAll();
    els.liveRegion.textContent = correct
      ? "回答正确"
      : `回答错误，正确答案是 ${question.answer}`;
  }

  function addQuestions(items) {
    const seen = new Set(state.questions.map((question) => normalizeStem(question.stem)));
    const added = [];
    let duplicates = 0;

    for (const item of items) {
      const key = normalizeStem(item.stem);
      if (!key || seen.has(key)) {
        duplicates += 1;
        continue;
      }
      seen.add(key);
      const question = {
        ...item,
        id: uid(),
        createdAt: Number(item.createdAt) || Date.now(),
        updatedAt: Date.now(),
      };
      state.questions.push(question);
      added.push(question);
    }

    if (added.length) {
      state.currentId = added[0].id;
      ui.selection = [];
      ui.revealed = false;
      saveState();
      renderAll();
    }

    return { added: added.length, duplicates, firstId: added[0] ? added[0].id : null };
  }

    const blob = new Blob([JSON.stringify(payload, null, 2)], {
      type: "application/json;charset=utf-8",
    });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const date = new Date();
    const stamp = `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, "0")}${String(
      date.getDate(),
    ).padStart(2, "0")}`;
    link.href = url;
    link.download = `错题本备份-${stamp}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("备份已导出");
  }

  function parseBackup(text) {
    let data;
    try {
      data = JSON.parse(String(text ?? ""));
    } catch (error) {
      throw new Error("JSON 解析失败，请确认选择的是本页面导出的备份文件。");
    }

    if (Array.isArray(data)) {
      data = { questions: data, mnemonics: [] };
    }
    if (!data || typeof data !== "object" || !Array.isArray(data.questions)) {
      throw new Error("备份格式不正确，缺少 questions 题库数据。");
    }

    const questions = [];
    const mnemonics = [];
    const cautions = [];
    const errors = [];
    data.questions.forEach((raw, index) => {
      try {
        questions.push(normalizeImportedQuestion(raw));
      } catch (error) {
        errors.push(`题目 ${index + 1}：${error.message}`);
      }
    });
    (Array.isArray(data.mnemonics) ? data.mnemonics : []).forEach((raw, index) => {
      const mnemonic = normalizeMnemonic(raw);
      if (mnemonic) mnemonics.push(mnemonic);
      else errors.push(`口诀 ${index + 1}：缺少标题或内容`);
    });
    (Array.isArray(data.cautions) ? data.cautions : []).forEach((raw, index) => {
      const caution = normalizeCaution(raw);
      if (caution) cautions.push(caution);
      else errors.push(`注意 ${index + 1}：缺少标题或内容`);
    });

    if (!questions.length && !mnemonics.length && !cautions.length) {
      throw new Error("备份中没有可恢复的题目、口诀或做题注意。");
    }

    return {
      questions,
      mnemonics,
      cautions,
      exportedAt: typeof data.exportedAt === "string" ? data.exportedAt : null,
      errors,
    };
  }

  function mergeBackupData(backup) {
    const questionsByStem = new Map(
      state.questions.map((question) => [normalizeStem(question.stem), question]),
    );
    let addedQuestions = 0;
    let updatedQuestions = 0;
    let addedMnemonics = 0;
    let addedCautions = 0;

    for (const incoming of backup.questions) {
      const key = normalizeStem(incoming.stem);
      const existing = questionsByStem.get(key);
      if (!existing) {
        incoming.id = uid();
        state.questions.push(incoming);
        questionsByStem.set(key, incoming);
        addedQuestions += 1;
        continue;
      }
      let changed = false;
      if (!existing.note && incoming.note) {
        existing.note = incoming.note;
        changed = true;
      }
      if (existing.attempts === 0 && incoming.attempts > 0) {
        existing.attempts = incoming.attempts;
        existing.correctCount = incoming.correctCount;
        existing.lastResult = incoming.lastResult;
        changed = true;
      }
      if (incoming.mastered && !existing.mastered) {
        existing.mastered = true;
        changed = true;
      }
      if (incoming.explanation && !existing.explanation) {
        existing.explanation = incoming.explanation;
        changed = true;
      }
      if (changed) {
        existing.updatedAt = Date.now();
        updatedQuestions += 1;
      }
    }

    const mnemonicKeys = new Set(
      state.mnemonics.map((item) => normalizeStem(`${item.title}|${item.content}`)),
    );
    for (const incoming of backup.mnemonics) {
      const key = normalizeStem(`${incoming.title}|${incoming.content}`);
      if (!mnemonicKeys.has(key)) {
        incoming.id = uid();
        state.mnemonics.push(incoming);
        mnemonicKeys.add(key);
        addedMnemonics += 1;
      }
    }

    const cautionKeys = new Set(
      state.cautions.map((item) => normalizeStem(`${item.title}|${item.content}`)),
    );
    for (const incoming of backup.cautions) {
      const key = normalizeStem(`${incoming.title}|${incoming.content}`);
      if (!cautionKeys.has(key)) {
        incoming.id = uid();
        state.cautions.push(incoming);
        cautionKeys.add(key);
        addedCautions += 1;
      }
    }

    return { addedQuestions, updatedQuestions, addedMnemonics, addedCautions };
  }
