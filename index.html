  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;
    const input = text.replace(/^\uFEFF/, "");

    for (let index = 0; index < input.length; index += 1) {
      const char = input[index];
      if (inQuotes) {
        if (char === '"') {
          if (input[index + 1] === '"') {
            field += '"';
            index += 1;
          } else {
            inQuotes = false;
          }
        } else {
          field += char;
        }
      } else if (char === '"') {
        inQuotes = true;
      } else if (char === ",") {
        row.push(field);
        field = "";
      } else if (char === "\n") {
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      } else if (char !== "\r") {
        field += char;
      }
    }

    if (field.length || row.length) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter((cells) => cells.some((cell) => cell.trim() !== ""));
  }

  function normHeader(value) {
    return String(value ?? "")
      .trim()
      .toLowerCase()
      .replace(/[\s_\-:：（）()]/g, "");
  }

  function findColumn(header, aliases) {
    const normalized = header.map(normHeader);
    for (const alias of aliases) {
      const target = normHeader(alias);
      const index = normalized.findIndex(
        (value) => value === target || value.includes(target),
      );
      if (index !== -1) return index;
    }
    return -1;
  }

  function findOptionColumn(header, letter) {
    const normalized = header.map(normHeader);
    const targets = [
      letter.toLowerCase(),
      `选项${letter.toLowerCase()}`,
      `option${letter.toLowerCase()}`,
      `choice${letter.toLowerCase()}`,
    ];
    return normalized.findIndex((value) => targets.includes(value));
  }

  function parseCSVToRaws(text) {
    const rows = parseCSV(text);
    if (!rows.length) return [];

    const header = rows[0].map((cell) => String(cell));
    const stemIndex = findColumn(header, ["题目", "题干", "问题", "question", "stem", "title"]);
    const answerIndex = findColumn(header, ["答案", "正确答案", "参考答案", "answer", "correct", "key"]);
    const explanationIndex = findColumn(header, ["解析", "答案解析", "分析", "explanation", "analysis"]);
    const subjectIndex = findColumn(header, ["学科", "科目", "subject", "category"]);
    const tagsIndex = findColumn(header, ["标签", "tags", "tag"]);

    if (stemIndex === -1) {
      const looksLikeHeader = header.some((cell) => /答案|answer|correct/i.test(cell));
      if (looksLikeHeader) {
        throw new Error("CSV 缺少题干列，表头应包含“题目”或“题干”。");
      }
      return rows.map((cells) => ({
        stem: cells[0],
        A: cells[1],
        B: cells[2],
        C: cells[3],
        D: cells[4],
        answer: cells[5],
        explanation: cells[6] || "",
        subject: cells[7] || "",
        tags: cells[8] || "",
      }));
    }

    const optionIndexes = {};
    for (const letter of ["A", "B", "C", "D", "E", "F"]) {
      optionIndexes[letter] = findOptionColumn(header, letter);
    }

    return rows.slice(1).map((cells) => {
      const raw = {
        stem: cells[stemIndex] || "",
        answer: answerIndex >= 0 ? cells[answerIndex] || "" : "",
        explanation: explanationIndex >= 0 ? cells[explanationIndex] || "" : "",
        subject: subjectIndex >= 0 ? cells[subjectIndex] || "" : "",
        tags: tagsIndex >= 0 ? cells[tagsIndex] || "" : "",
      };
      for (const letter of ["A", "B", "C", "D", "E", "F"]) {
        if (optionIndexes[letter] >= 0) raw[letter] = cells[optionIndexes[letter]] || "";
      }
      return raw;
    });
  }

  function parseTextBlock(block) {
    if (block.includes("|")) {
      const parts = block.split(/\s*\|\s*/).map((part) => part.trim());
      if (parts.length >= 6) {
        return {
          stem: parts[0],
          A: parts[1],
          B: parts[2],
          C: parts[3],
          D: parts[4],
          answer: parts[5],
          explanation: parts[6] || "",
          subject: parts[7] || "",
          tags: parts[8] || "",
        };
      }
    }

    const lines = block
      .split(/\r?\n/)
      .map((line) => line.trim())
      .filter(Boolean);
    const stemLines = [];
    const options = [];
    const explanationLines = [];
    let answer = "";
    let subject = "";
    let tags = "";
    let mode = "stem";

    for (const line of lines) {
      if (mode === "stem" || mode === "option") {
        const optionMatch = line.match(/^([A-F])\s*[.、．:：，,]\s*(.+)$/);
        if (optionMatch) {
          options.push({ key: optionMatch[1], text: optionMatch[2].trim() });
          mode = "option";
          continue;
        }
      }

      const answerMatch = line.match(
        /^(?:答案|正确答案|参考答案)\s*[：:]?\s*([A-Fa-f][A-Fa-f、,，\s]*)/,
      );
      if (answerMatch && mode !== "explanation") {
        answer = answerMatch[1];
        mode = "answer";
        continue;
      }

      const explanationMatch = line.match(/^(?:解析|答案解析|分析)\s*[：:]?\s*(.*)$/);
      if (explanationMatch) {
        if (explanationMatch[1]) explanationLines.push(explanationMatch[1]);
        mode = "explanation";
        continue;
      }

      const subjectMatch = line.match(/^(?:学科|科目)\s*[：:]\s*(.+)$/);
      if (subjectMatch) {
        subject = subjectMatch[1].trim();
        mode = "meta";
        continue;
      }

      const tagsMatch = line.match(/^标签\s*[：:]\s*(.+)$/);
      if (tagsMatch) {
        tags = tagsMatch[1].trim();
        mode = "meta";
        continue;
      }

      if (mode === "stem") {
        stemLines.push(line);
      } else if (mode === "option" && options.length) {
        options[options.length - 1].text += ` ${line}`;
      } else if (mode === "explanation") {
        explanationLines.push(line);
      }
    }

    if (stemLines.length) {
      stemLines[0] = stemLines[0].replace(/^(?:\d+[.、．，,]|第\s*\d+\s*题)\s*/, "");
    }

    return {
      stem: stemLines.join(" "),
      options,
      answer,
      explanation: explanationLines.join("\n"),
      subject,
      tags,
    };
  }

  function parseTextToRaws(text) {
    const hasNumberedBlocks = /^\s*(?:\d+[.、．，,]|第\s*\d+\s*题)/m.test(text);
    let blocks;
    if (hasNumberedBlocks) {
      blocks = text
        .split(/(?=^\s*(?:\d+[.、．，,]|第\s*\d+\s*题)\s*)/m)
        .map((block) => block.trim())
        .filter(Boolean);
    } else {
      blocks = text
        .split(/\n\s*\n+/)
        .map((block) => block.trim())
        .filter(Boolean);
    }
    return blocks.map(parseTextBlock);
  }

  function parseCaseTextToRaws(text) {
    const normalized = String(text ?? "").replace(/\r/g, "").trim();
    const headerMatch = normalized.match(
      /^【病例题】\s*(.*?)\n([\s\S]*?)(?=【第\s*1\s*问】)/,
    );
    if (!headerMatch) {
      throw new Error("病例题格式不正确：需要【病例题】标题和【第1问】");
    }

    const caseTitle = headerMatch[1].trim() || "病例题";
    const header = headerMatch[2];
    const subject =
      header.match(/^(?:学科|科目)\s*[：:]\s*(.+)$/m)?.[1]?.trim() || "未分类";
    const tags = header.match(/^标签\s*[：:]\s*(.+)$/m)?.[1]?.trim() || "";
    const caseText = header
      .replace(/^(?:学科|科目|标签)\s*[：:].*$/gm, "")
      .replace(/^病例(?:描述)?\s*[：:]?\s*/m, "")
      .trim();
    if (!caseText) throw new Error("病例题缺少病例描述");

    const chunks = normalized.split(/【第\s*(\d+)\s*问】/);
    const subs = [];
    for (let index = 1; index < chunks.length; index += 2) {
      const body = chunks[index + 1]?.trim();
      if (!body) continue;
      const raw = parseTextBlock(body);
      if (!raw.stem || !raw.options.length) {
        throw new Error(`第 ${chunks[index]} 问缺少题干或选项`);
      }
      subs.push(raw);
    }
    if (!subs.length) throw new Error("病例题没有可用的子问题");

    const caseId = uid();
    return subs.map((sub, index) => ({
      ...sub,
      caseId,
      caseTitle,
      caseText,
      caseOrder: index,
      caseTotal: subs.length,
      subject: sub.subject || subject,
      tags: sub.tags || tags,
    }));
  }

  function normalizeImportedQuestion(raw) {
    if (!raw || typeof raw !== "object") {
      throw new Error("不是有效的题目对象");
    }

    const stem = String(
      raw.stem ?? raw.question ?? raw.title ?? raw["题干"] ?? raw["题目"] ?? raw["问题"] ?? "",
    ).trim();
    if (!stem) throw new Error("缺少题干");

    let options = [];
    const rawOptions = raw.options ?? raw.choices ?? raw["选项"];

    if (Array.isArray(rawOptions)) {
      options = rawOptions.map((item, index) => {
        if (item && typeof item === "object") {
          return {
            key: letterAt(index),
            text: String(item.text ?? item.label ?? item.content ?? item.value ?? "").trim(),
          };
        }
        return { key: letterAt(index), text: String(item ?? "").trim() };
      });
    } else if (rawOptions && typeof rawOptions === "object") {
      options = Object.keys(rawOptions)
        .filter((key) => /^[A-F]$/i.test(key))
        .sort()
        .map((key) => ({ key: key.toUpperCase(), text: String(rawOptions[key] ?? "").trim() }));
    } else {
      for (const letter of ["A", "B", "C", "D", "E", "F"]) {
        const value =
          raw[letter] ??
          raw[`选项${letter}`] ??
          raw[`option${letter}`] ??
          raw[`choice${letter}`];
        if (value !== undefined && value !== null && String(value).trim()) {
          options.push({ key: letter, text: String(value).trim() });
        }
      }
    }

    options = options.filter((option) => option.text);
    if (options.length < 2) throw new Error("至少需要两个有效选项");
    options = options.map((option, index) => ({ key: letterAt(index), text: option.text }));

    const answer = normalizeAnswer(
      raw.answer ?? raw.correct ?? raw["答案"] ?? raw["正确答案"] ?? raw["参考答案"],
      options.length,
    );
    if (!answer) throw new Error("缺少有效答案（如 C 或 ACD）");

    const tagsValue = raw.tags ?? raw["标签"] ?? "";
    const tags = Array.isArray(tagsValue)
      ? tagsValue.map(String)
      : String(tagsValue)
          .split(/[,，、;；]/)
          .map((tag) => tag.trim())
          .filter(Boolean);

    return {
      id: uid(),
      stem,
      options,
      answer,
      explanation: String(
        raw.explanation ?? raw.analysis ?? raw["解析"] ?? raw["答案解析"] ?? "",
      ).trim(),
      subject:
        String(raw.subject ?? raw["学科"] ?? raw["科目"] ?? "未分类").trim() || "未分类",
      tags: [...new Set(tags)].slice(0, 6),
      caseId: typeof raw.caseId === "string" && raw.caseId ? raw.caseId : null,
      caseTitle: String(raw.caseTitle ?? "").trim(),
      caseText: String(raw.caseText ?? raw.case ?? "").trim(),
      caseOrder: Number(raw.caseOrder) || 0,
      caseTotal: Number(raw.caseTotal) || 0,
      note: String(raw.note ?? ""),
      attempts: Number(raw.attempts) || 0,
      correctCount: Number(raw.correctCount) || 0,
      lastResult:
        raw.lastResult === "correct" || raw.lastResult === "wrong" ? raw.lastResult : null,
      mastered: Boolean(raw.mastered),
      createdAt: Number(raw.createdAt) || Date.now(),
      updatedAt: Date.now(),
    };
  }

  function expandCaseRaw(raw) {
    if (!raw || typeof raw !== "object") return [raw];
    const isCase =
      String(raw.type || "").toLowerCase() === "case" ||
      (Array.isArray(raw.questions) && Boolean(raw.case || raw.caseText || raw.description));
    if (!isCase) return [raw];

    const subs = raw.questions;
    if (!Array.isArray(subs) || !subs.length) {
      throw new Error("病例题需要至少一个子问题");
    }
    const caseText = String(raw.case ?? raw.caseText ?? raw.description ?? "").trim();
    if (!caseText) throw new Error("病例题缺少病例描述");
    const caseTitle = String(raw.title ?? raw.caseTitle ?? "病例题").trim() || "病例题";
    const caseId = uid();
    const subject = raw.subject ?? raw["学科"] ?? "未分类";
    const tags = raw.tags ?? raw["标签"] ?? [];

    return subs.map((sub, index) => ({
      ...sub,
      caseId,
      caseTitle,
      caseText,
      caseOrder: index,
      caseTotal: subs.length,
      subject: sub.subject ?? subject,
      tags: sub.tags ?? tags,
    }));
  }

  function parseImport(text) {
    const trimmed = String(text ?? "").trim();
    if (!trimmed) return { items: [], errors: ["内容为空"] };

    let raws = [];
    try {
      if (trimmed.startsWith("[") || trimmed.startsWith("{")) {
        const data = JSON.parse(trimmed);
        if (Array.isArray(data)) {
          raws = data;
        } else if (
          data &&
          (String(data.type || "").toLowerCase() === "case" ||
            data.case ||
            data.caseText ||
            data.description)
        ) {
          raws = [data];
        } else if (data && Array.isArray(data.questions)) {
          raws = data.questions;
        } else if (data && typeof data === "object") {
          raws = [data];
        } else {
          return { items: [], errors: ["JSON 顶层应为题目数组或包含 questions 数组"] };
        }
      } else {
        const firstLine = trimmed.split(/\r?\n/, 1)[0];
        const looksLikeCSV =
          firstLine.includes(",") &&
          (/(题目|题干|question|stem|答案|answer)/i.test(firstLine) ||
            firstLine.split(",").length >= 6);
        raws = looksLikeCSV
          ? parseCSVToRaws(trimmed)
          : trimmed.includes("【病例题】")
            ? parseCaseTextToRaws(trimmed)
            : parseTextToRaws(trimmed);
      }
    } catch (error) {
      return { items: [], errors: [error.message || "内容解析失败"] };
    }

    const expanded = [];
    const errors = [];
    raws.forEach((raw, index) => {
      try {
        expanded.push(...expandCaseRaw(raw));
      } catch (error) {
        errors.push(`第 ${index + 1} 条：${error.message}`);
      }
    });

    const items = [];
    expanded.forEach((raw, index) => {
      try {
        items.push(normalizeImportedQuestion(raw));
      } catch (error) {
        errors.push(`第 ${index + 1} 条：${error.message}`);
      }
    });

    return { items, errors };
  }

  function openImportModal() {
    if (ui.modalOpen) return;

    const close = () => closeImportModal();

    document.getElementById("cancelImport").addEventListener("click", close);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) close();
    });

    const chooseFile = () => fileInput.click();
    dropzone.addEventListener("click", chooseFile);
    dropzone.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {

      const file = event.dataTransfer.files && event.dataTransfer.files[0];
      if (file) await readImportFile(file);

      const file = fileInput.files && fileInput.files[0];
      if (file) await readImportFile(file);
      fileInput.value = "";
    });

    modal.addEventListener("paste", (event) => {
      const items = event.clipboardData && event.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (file) {
            event.preventDefault();
            handleImageFile(file);
            break;

  function closeImportModal() {
    if (!ui.modalOpen) return;
    ui.modalOpen = false;
    els.modalRoot.innerHTML = "";
    document.body.classList.remove("modal-open");
    document.removeEventListener("keydown", handleModalKeydown);
    if (ui.lastFocus && ui.lastFocus.isConnected) {
      ui.lastFocus.focus({ preventScroll: true });
    }
    ui.lastFocus = null;
  }

  function handleModalKeydown(event) {
    if (!ui.modalOpen) return;
    if (event.key === "Escape") {
      event.preventDefault();
      closeImportModal();
      return;
    }
    if (event.key !== "Tab") return;

    const modal = document.querySelector("#importModal .modal");
    if (!modal) return;
    const focusables = [
      ...modal.querySelectorAll(
        'button, [href], input:not([type="hidden"]), select, textarea, summary, [tabindex]:not([tabindex="-1"])',
      ),
    ].filter((element) => !element.disabled && element.offsetParent !== null);
    if (!focusables.length) return;

    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function isImageFile(file) {
    return Boolean(file) && (
      String(file.type || "").startsWith("image/") ||
      /\.(png|jpe?g|webp|bmp)$/i.test(file.name || "")
    );
  }

  function setOcrStatus(title, detail, progress) {

    if (!box) return;
    const percent = Math.max(0, Math.min(100, Number(progress) || 0));
    box.innerHTML = `
      <strong>${escapeHtml(title)}</strong>
      <span>${escapeHtml(detail || "")}</span>
      <div class="ocr-progress"><span style="width:${percent}%"></span></div>
    `;

  function loadScriptSource(source) {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = source;
      script.async = true;
      script.onload = () => resolve();
      script.onerror = () => reject(new Error(`无法加载 ${source}`));
      document.head.appendChild(script);
    });
  }

  async function ensureTesseract() {
    if (window.Tesseract) return;
    if (!tesseractLoadingPromise) {
      tesseractLoadingPromise = (async () => {
        const sources = [
          "./tesseract/tesseract.min.js",
          "https://fastly.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js",
          "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js",
        ];
        let lastError = null;
        for (const source of sources) {
          try {
            await loadScriptSource(source);
            if (window.Tesseract) return;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("OCR engine not loaded");
      })().catch((error) => {
        tesseractLoadingPromise = null;
        throw error;
      });
    }
    return tesseractLoadingPromise;
  }

  async function getOcrWorker() {
    await ensureTesseract();
    if (!ocrWorkerPromise) {
      ocrWorkerPromise = (async () => {
        const pathSets = [
          {
            workerPath: "./tesseract/worker.min.js",
            corePath: "./tesseract/core",
            langPath: "./tessdata",
          },
          {
            workerPath:
              "https://fastly.jsdelivr.net/npm/tesseract.js@7.0.0/dist/worker.min.js",
            corePath: "https://fastly.jsdelivr.net/npm/tesseract.js-core@7.0.0",
            langPath:
              "https://fastly.jsdelivr.net/gh/tesseract-ocr/tessdata_fast@main",
          },
          {
            workerPath:
              "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/worker.min.js",
            corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0",
            langPath:
              "https://cdn.jsdelivr.net/gh/tesseract-ocr/tessdata_fast@main",
          },
        ];
        const logger = (message) => {
          const labels = {
            "loading tesseract core": "加载识别引擎",
            "initializing tesseract": "初始化识别引擎",
            "loading language traineddata": "加载中文模型",
            "initializing api": "准备识别",
            "recognizing text": "识别文字",
          };
          const label = labels[message.status] || message.status || "识别中";
          const progress =
            typeof message.progress === "number"
              ? Math.round(message.progress * 100)
              : null;
          setOcrStatus(
            label,
            progress === null ? "首次使用会稍慢，请稍候。" : `${progress}%`,
            progress,
          );
        };

        let lastError = null;
        for (const paths of pathSets) {
          try {
            const worker = await window.Tesseract.createWorker(["chi_sim"], 1, {
              workerPath: paths.workerPath,
              corePath: paths.corePath,
              langPath: paths.langPath,
              gzip: false,
              logger,
            });
            await worker.setParameters({ preserve_interword_spaces: "1" });
            return worker;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("OCR worker unavailable");
      })().catch((error) => {
        ocrWorkerPromise = null;
        throw error;
      });
    }
    return ocrWorkerPromise;
  }

  async function prepareOcrImage(file) {
    if (typeof window.createImageBitmap !== "function") return file;
    try {
      const bitmap = await window.createImageBitmap(file);
      const minWidth = 1200;
      const maxWidth = 2000;
      let scale = 1;
      if (bitmap.width < minWidth) {
        scale = Math.min(2.5, minWidth / bitmap.width);
      } else if (bitmap.width > maxWidth) {
        scale = maxWidth / bitmap.width;
      }
      if (Math.abs(scale - 1) < 0.05) {
        if (typeof bitmap.close === "function") bitmap.close();
        return file;
      }
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      const context = canvas.getContext("2d");
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      if (typeof bitmap.close === "function") bitmap.close();
      return canvas;
    } catch (error) {
      return file;
    }
  }

  function normalizeOcrText(text) {
    let value = String(text || "")
      .replace(/\r/g, "")
      .replace(/\u00a0/g, " ");
    value = value.replace(/[ \t]+/g, " ");
    for (let index = 0; index < 2; index += 1) {
      value = value.replace(/([\u4e00-\u9fff])\s+([\u4e00-\u9fff])/g, "$1$2");
    }
    value = value.replace(/([\u4e00-\u9fff])\s+([，。；：、！？])/g, "$1$2");
    value = value.replace(/([，。；：、！？])\s+/g, "$1");
    value = value.replace(
      /(^|\n|\s)([A-F])\s*[.、．:：，,]\s*/g,
      (match, prefix, letter) => `${prefix === " " ? "\n" : prefix}${letter}. `,
    );
    value = value.replace(/\s*(答案|正确答案|参考答案)\s*[：:]\s*/g, "\n$1：");
    value = value.replace(/\s*(解析|答案解析|分析)\s*[：:]\s*/g, "\n$1：");
    value = value.replace(/\s*(学科|科目)\s*[：:]\s*/g, "\n$1：");
    value = value.replace(/\s*标签\s*[：:]\s*/g, "\n标签：");
    value = value.replace(/\n{3,}/g, "\n\n");
    return value.trim();
  }

  async function handleImageFile(file) {
    if (!file) return;
    if (!isImageFile(file)) {
      showImportResult("请选择 PNG、JPG 或 WEBP 格式的截图。", "error");
      return;
    }
    if (file.size > 12 * 1024 * 1024) {
      showImportResult("截图超过 12 MB，请压缩或裁剪后再试。", "error");
      return;
    }
    if (ocrBusy) {
      toast("正在识别上一张截图，请稍候");
      return;
    }

    ocrBusy = true;
    showImportResult("", "ok", true);
    const preview = document.getElementById("imagePreview");
    const previewImage = document.getElementById("ocrPreview");
    const objectUrl = URL.createObjectURL(file);
    if (preview && previewImage) {
      previewImage.src = objectUrl;
      preview.hidden = false;
    }
    setOcrStatus("准备识别", "首次使用需要加载中文识别模型，请稍候。", 0);

    try {
      const worker = await getOcrWorker();
      const image = await prepareOcrImage(file);
      const result = await worker.recognize(image);
      const normalized = normalizeOcrText(result.data.text);
      if (!normalized) {
        setOcrStatus(
          "没有识别到文字",
          "请换一张更清晰、正对题目的截图，或直接粘贴文字。",
          0,
        );
        return;
      }

      const area = document.getElementById("importText");
      if (area) {
        area.value = area.value.trim()
          ? `${area.value.trim()}\n\n${normalized}`
          : normalized;
        area.focus();
      }
      setOcrStatus(
        "识别完成",
        "请校对文字、选项和答案，确认后点击“导入题目”。",
        100,
      );
    } catch (error) {
      console.error(error);
      setOcrStatus(
        "识别失败",
        "请确认网页是通过本地服务或公网链接打开；也可以直接粘贴文字。",
        0,
      );
      toast("截图识别失败，请改用粘贴文字", "error");
    } finally {
      ocrBusy = false;
      window.setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
    }
  }

  async function readImportFile(file) {
    if (isImageFile(file)) {
      await handleImageFile(file);
      return;
    }
    const preview = document.getElementById("imagePreview");
    if (preview) preview.hidden = true;
    if (!/\.(json|csv|txt|md|markdown)$/i.test(file.name)) {
      showImportResult("请选择 JSON、CSV、TXT、Markdown 或截图文件。", "error");
      return;
    }
    if (file.size > 3 * 1024 * 1024) {
      showImportResult("文件超过 3 MB，请拆分后再导入。", "error");
      return;
    }

    try {
      const text =
        typeof file.text === "function"
          ? await file.text()
          : await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result || ""));
              reader.onerror = () => reject(reader.error);
              reader.readAsText(file, "utf-8");
            });
      const importText = document.getElementById("importText");
      const fileName = document.getElementById("modalFileName");
      importText.value = text;
      fileName.textContent = `已读取：${file.name}`;
      showImportResult("", "ok", true);
    } catch (error) {
      showImportResult("文件读取失败，请换一个文件重试。", "error");
    }
  }

  function doImport() {
    const importText = document.getElementById("importText");
    const text = importText ? importText.value.trim() : "";
    if (!text) {
      showImportResult("请先选择文件，或粘贴题目内容。", "error");
      return;
    }

    const result = parseImport(text);
    if (!result.items.length) {
      const details = result.errors.slice(0, 4).join("\n");
      showImportResult(
        `没有识别到有效题目。${details ? `\n${details}` : "\n请检查格式是否包含题干、选项和答案。"}`,
        "error",
      );
      return;
    }

    const addedResult = addQuestions(result.items);
    if (!addedResult.added) {
      showImportResult("识别到的题目都已经在题库中，没有新增内容。", "error");
      return;
    }

    const parts = [`已导入 ${addedResult.added} 道题`];
    if (addedResult.duplicates) parts.push(`跳过 ${addedResult.duplicates} 道重复题`);
    if (result.errors.length) parts.push(`${result.errors.length} 道未能识别`);
    closeImportModal();
    toast(parts.join("，"));
  }

  function clearAllData() {
    if (!window.confirm("确定清空全部题目、作答记录和笔记吗？此操作不可撤销。")) return;

    state.questions = [];
    state.currentId = null;
    state.filter = "all";
    state.subject = "all";
    state.query = "";
    els.searchInput.value = "";
    ui.selection = [];
    ui.revealed = false;
    ui.noteDirty = false;
    window.clearTimeout(ui.noteTimer);

    try {
      window.localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      /* 本地存储不可用时只清空内存 */
    }

    closeImportModal();
    renderAll();
    toast("已清空全部数据");
  }

  function bindEvents() {
    let searchTimer = null;

    els.importBtn.addEventListener("click", openImportModal);
    els.backupBtn.addEventListener("click", openBackupModal);

    document.querySelectorAll(".view-tab").forEach((button) => {
      button.addEventListener("click", () => {
        const view = button.dataset.view;
        state.view = ["practice", "mnemonics", "cautions"].includes(view)
          ? view
          : "practice";
        saveState();
        renderAll();
      });
    });

    els.newMnemonicBtn.addEventListener("click", () => openMnemonicModal());

    els.mnemonicSearch.addEventListener("input", () => {
      ui.mnemonicQuery = els.mnemonicSearch.value;
      els.clearMnemonicSearch.classList.toggle("is-visible", Boolean(ui.mnemonicQuery));
      renderMnemonics();
    });

    els.clearMnemonicSearch.addEventListener("click", () => {
      ui.mnemonicQuery = "";
      els.mnemonicSearch.value = "";
      els.clearMnemonicSearch.classList.remove("is-visible");
      renderMnemonics();
      els.mnemonicSearch.focus();
    });

    els.mnemonicSubjectFilter.addEventListener("change", () => {
      ui.mnemonicSubject = els.mnemonicSubjectFilter.value;
      renderMnemonics();
    });

    els.mnemonicGrid.addEventListener("click", (event) => {
      const actionElement = event.target.closest("[data-mnemonic-action]");
      if (!actionElement) return;
      const action = actionElement.dataset.mnemonicAction;
      const id = actionElement.dataset.id;
      if (action === "new") {
        openMnemonicModal();
      } else if (action === "clear-filter") {
        ui.mnemonicQuery = "";
        ui.mnemonicSubject = "all";
        els.mnemonicSearch.value = "";
        renderMnemonics();
      } else if (action === "edit") {
        const target = state.mnemonics.find((item) => item.id === id);
        if (target) openMnemonicModal(target);
      } else if (action === "pin") {
        toggleMnemonicPin(id);
      } else if (action === "delete") {
        deleteMnemonic(id);
      }
    });

    els.newCautionBtn.addEventListener("click", () => openCautionModal());

    els.cautionSearch.addEventListener("input", () => {
      ui.cautionQuery = els.cautionSearch.value;
      els.clearCautionSearch.classList.toggle("is-visible", Boolean(ui.cautionQuery));
      renderCautions();
    });

    els.clearCautionSearch.addEventListener("click", () => {
      ui.cautionQuery = "";
      els.cautionSearch.value = "";
      els.clearCautionSearch.classList.remove("is-visible");
      renderCautions();
      els.cautionSearch.focus();
    });

    els.cautionSubjectFilter.addEventListener("change", () => {
      ui.cautionSubject = els.cautionSubjectFilter.value;
      renderCautions();
    });

    els.cautionStatusFilter.addEventListener("change", () => {
      ui.cautionStatus = els.cautionStatusFilter.value;
      renderCautions();
    });

    els.cautionGrid.addEventListener("click", (event) => {
      const actionElement = event.target.closest("[data-caution-action]");
      if (!actionElement) return;
      const action = actionElement.dataset.cautionAction;
      const id = actionElement.dataset.id;
      if (action === "new") {
        openCautionModal();
      } else if (action === "load-demo") {
        loadDemoCautions();
      } else if (action === "clear-filter") {
        ui.cautionQuery = "";
        ui.cautionSubject = "all";
        ui.cautionStatus = "all";
        els.cautionSearch.value = "";
        renderCautions();
      } else if (action === "toggle") {
        toggleCautionChecked(id);
      } else if (action === "edit") {
        const target = state.cautions.find((item) => item.id === id);
        if (target) openCautionModal(target);
      } else if (action === "pin") {
        toggleCautionPin(id);
      } else if (action === "delete") {
        deleteCaution(id);
      }
    });

    els.searchInput.addEventListener("input", () => {
      state.query = els.searchInput.value;
      els.clearSearch.classList.toggle("is-visible", Boolean(state.query));
      window.clearTimeout(searchTimer);
      searchTimer = window.setTimeout(() => {
        ui.selection = [];
        ui.revealed = false;
        renderAll();
      }, 120);
    });

    els.clearSearch.addEventListener("click", () => {
      state.query = "";
      els.searchInput.value = "";
      els.clearSearch.classList.remove("is-visible");
      ui.selection = [];
      ui.revealed = false;
      renderAll();
      els.searchInput.focus();
    });

    els.filters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;
      state.filter = button.dataset.filter;
      ui.selection = [];
      ui.revealed = false;
      getCurrentQuestion();
      saveState();
      renderAll();
    });

    els.subjectFilter.addEventListener("change", () => {
      state.subject = els.subjectFilter.value;
      ui.selection = [];
      ui.revealed = false;
      getCurrentQuestion();
      saveState();
      renderAll();
    });

    els.questionList.addEventListener("click", (event) => {
      const item = event.target.closest(".q-item");
      if (item && item.dataset.id) selectQuestion(item.dataset.id);
    });

    els.main.addEventListener("click", handleMainClick);
    els.main.addEventListener("input", handleMainInput);
    document.addEventListener("keydown", handleGlobalKeydown);
    window.addEventListener("beforeunload", flushNote);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) flushNote();
    });
  }

  function init() {
    loadState();
    bindEvents();
    renderAll();
    if (!storageAvailable) {
      toast("浏览器未允许本地存储，刷新后数据会丢失", "error");
    }
  }

  window.__wrongbook = {
    getState: () => state,
    getFiltered,
    parseImport,
    parseBackup,
    addQuestions,
  };

  init();
})();

    </script>
